<!DOCTYPE html>
<html>
<head>
    <title>Academic Optimization System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="soft-compute-bg">
<div class="container soft-glass">

    <h1 class="soft-title">🎓 Academic Optimization Engine</h1>
    <p class="subtitle soft-desc">
        Intelligent Hybrid Soft Computing Analysis of Academic Performance & Cognitive Wellness
    </p>

    <form action="/analyze" method="post" class="form-card soft-card">

        <!-- ================= ACADEMIC METRICS ================= -->

        <h2 class="section-title">📊 Academic Performance</h2>

        <div class="input-group">
            <label>Attendance (%)</label>
            <input type="number" name="attendance" min="0" max="100" required>
        </div>

        <div class="input-group">
            <label>Quiz Average (%)</label>
            <input type="number" name="quiz_avg" min="0" max="100" required>
        </div>

        <div class="input-group">
            <label>Internal Assessment (%)</label>
            <input type="number" name="internal" min="0" max="100" required>
        </div>

        <!-- ================= STUDY BEHAVIOR ================= -->

        <h2 class="section-title">📚 Study Behavior</h2>

        <div class="input-group">
            <label>Study Hours Per Day</label>
            <input type="number" step="0.1" name="study_hours" min="0" max="16" required>
        </div>

        <div class="input-group">
            <label>Study Days Per Week (0-7)</label>
            <input type="number" name="study_days" min="0" max="7" required>
        </div>

        <div class="input-group">
            <label>Practice Problems Solved Per Week</label>
            <input type="number" name="practice_per_week" min="0" max="200" required>
        </div>

        <div class="input-group">
            <label>Average Assignment Delay (Days)</label>
            <input type="number" step="0.1" name="assignment_delay" min="0" max="30" required>
        </div>

        <!-- ================= WELLNESS & COGNITIVE ================= -->

        <h2 class="section-title">🧠 Cognitive & Wellness Factors</h2>

        <div class="input-group">
            <label>Sleep Hours Per Night</label>
            <input type="number" step="0.1" name="sleep_hours" min="0" max="12" required>
        </div>

        <div class="input-group">
            <label>Screen Time Per Day (Hours)</label>
            <input type="number" step="0.1" name="screen_time" min="0" max="16" required>
        </div>

        <div class="input-group">
            <label>Self-Confidence Level</label>
            <select name="confidence" required>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <div class="input-group">
            <label>Exam Anxiety Level</label>
            <select name="anxiety" required>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <button type="submit" class="btn-primary soft-compute-btn">
            Analyze Academic Profile
        </button>

    </form>

</div>
</body>
</html>
